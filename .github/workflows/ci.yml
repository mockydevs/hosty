name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
      - name: Forbidden patterns guard
        run: |
          ! grep -rn "shell=True" app/ && echo "OK: no shell=True"
          ! grep -rn "subprocess" app/ --include="*.py" -l | grep -v "system/runner.py" && echo "OK: subprocess only in runner"
