name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests (coverage floor 85% on system/ + services/)
        run: uv run pytest -q --cov=app/system --cov=app/services --cov-fail-under=85
      - name: Forbidden patterns guard
        run: bash ../scripts/forbidden_patterns.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec biome check .
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Tests
        run: pnpm exec vitest run
      - name: Build
        run: pnpm exec vite build
      - name: Bundle budget (initial < 300KB gzipped)
        run: node ../scripts/check_bundle_budget.mjs dist
