[project]
name = "hosty-backend"
version = "0.1.0"
description = "Hosty — hosting panel backend API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.137.2",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "structlog>=24.1",
    "psutil>=6.0",
    "boto3>=1.34",
    "cryptography>=42.0",
    "httpx>=0.27",
    "asyncssh>=2.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not vm' -p no:cacheprovider"
markers = [
    "vm: integration tests that require the privileged dev VM (run with: pytest -m vm)",
]
