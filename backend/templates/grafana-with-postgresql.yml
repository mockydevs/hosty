x-hosty:
  name: "Grafana With Postgresql"
  version: 1
  category: "Monitoring"
  icon: "activity"
  description: "Grafana is the open source analytics & monitoring solution for every database."
  web: grafana
  domain_input: domain
  secrets:
    - grafana_password
    - postgres_password
  inputs:
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"
    postgres_user:
      type: "string"
      default: "postgres"
      description: "Postgres username"

services:
  grafana:
    image: grafana/grafana-oss
    environment:

    - GF_SERVER_ROOT_URL=${domain}
    - GF_SERVER_DOMAIN=${domain}
    - GF_SECURITY_ADMIN_PASSWORD=${grafana_password}
    - GF_DATABASE_TYPE=postgres
    - GF_DATABASE_HOST=postgresql
    - GF_DATABASE_USER=${postgres_user}
    - GF_DATABASE_PASSWORD=${postgres_password}
    - GF_DATABASE_NAME=${POSTGRES_DB:-grafana}
    volumes:
    - grafana-data:/var/lib/grafana
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:3000/api/health
      interval: 5s
      timeout: 20s
      retries: 10
    depends_on:
    - postgresql
    ports:
    - 3000:3000
  postgresql:
    image: postgres:16-alpine
    volumes:
    - postgresql-data:/var/lib/postgresql/data
    environment:
    - POSTGRES_USER=${postgres_user}
    - POSTGRES_PASSWORD=${postgres_password}
    - POSTGRES_DB=${POSTGRES_DB:-grafana}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 20s
      retries: 10
