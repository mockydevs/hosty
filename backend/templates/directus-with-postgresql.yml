x-hosty:
  name: "Directus With Postgresql"
  version: 1
  category: "CMS"
  icon: "file-text"
  description: "Directus wraps databases with a dynamic API, and provides an intuitive app for managing its content."
  web: directus
  secrets:
    - admin_password
    - postgresql_password
  inputs:
    postgresql_user:
      type: "string"
      default: "postgresql"
      description: "Postgresql username"

services:
  directus:
    image: directus/directus:11
    volumes:
    - directus-uploads:/directus/uploads
    - directus-extensions:/directus/extensions
    - directus-templates:/directus/templates
    environment:

    - KEY=$SERVICE_BASE64_64_KEY
    - SECRET=$SERVICE_BASE64_64_SECRET
    - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
    - ADMIN_PASSWORD=${admin_password}
    - DB_CLIENT=postgres
    - DB_HOST=postgresql
    - DB_PORT=5432
    - DB_DATABASE=${POSTGRESQL_DATABASE:-directus}
    - DB_USER=${postgresql_user}
    - DB_PASSWORD=${postgresql_password}
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - WEBSOCKETS_ENABLED=true
    - CORS_ENABLED=${CORS_ENABLED:-true}
    - CORS_ORIGIN=${CORS_ORIGIN}
    - CORS_METHODS=${CORS_METHODS:-GET,POST,PATCH,DELETE,OPTIONS}
    - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS:-Content-Type,Authorization}
    - CORS_CREDENTIALS=${CORS_CREDENTIALS:-true}
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:8055/admin/login
      interval: 5s
      timeout: 20s
      retries: 10
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
    - 8055:8055
  postgresql:
    image: postgis/postgis:16-3.4-alpine
    platform: linux/amd64
    volumes:
    - directus-postgresql-data:/var/lib/postgresql/data
    environment:
    - POSTGRES_USER=${postgresql_user}
    - POSTGRES_PASSWORD=${postgresql_password}
    - POSTGRES_DB=${POSTGRESQL_DATABASE:-directus}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 20s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
    - directus-redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 20s
      retries: 10
