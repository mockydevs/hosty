x-hosty:
  name: "Docmost"
  version: 1
  category: "Applications"
  icon: "box"
  description: "Open-source collaborative wiki and documentation software"
  web: docmost
  domain_input: domain
  secrets:
    - postgres_password
  inputs:
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"
    postgres_user:
      type: "string"
      default: "postgres"
      description: "Postgres username"

services:
  docmost:
    image: docmost/docmost:latest
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:

    - APP_SECRET=$SERVICE_BASE64_APPKEY
    - APP_URL=${domain}_3000
    - DATABASE_URL=postgresql://${postgres_user}:${postgres_password}@postgresql/docmost?schema=public
    - REDIS_URL=redis://redis:6379
    - MAIL_DRIVER=${MAIL_DRIVER:?}
    - SMTP_HOST=${SMTP_HOST}
    - SMTP_PORT=${SMTP_PORT}
    - SMTP_USERNAME=${SMTP_USERNAME}
    - SMTP_PASSWORD=${SMTP_PASSWORD}
    - SMTP_SECURE=${SMTP_SECURE}
    - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
    - MAIL_FROM_NAME=${MAIL_FROM_NAME}
    - POSTMARK_TOKEN=${POSTMARK_TOKEN}
    volumes:
    - docmost:/app/data/storage
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:3000
      interval: 2s
      timeout: 10s
      retries: 20
    ports:
    - 3000:3000
  postgresql:
    image: postgres:16-alpine
    environment:
    - POSTGRES_USER=${postgres_user}
    - POSTGRES_PASSWORD=${postgres_password}
    - POSTGRES_DB=docmost
    volumes:
    - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 10s
      retries: 20
  redis:
    image: redis:7.2-alpine
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - PING
      interval: 5s
      timeout: 10s
      retries: 20
