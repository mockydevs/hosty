x-hosty:
  name: "Cloudbeaver"
  version: 1
  category: "Developer Tools"
  icon: "code-2"
  description: "CloudBeaver is a lightweight web application designed for comprehensive data management."
  web: cloudbeaver

services:
  cloudbeaver:
    image: dbeaver/cloudbeaver:24
    volumes:
    - cloudbeaver-data:/opt/cloudbeaver/workspace
    environment:

    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:8978/
      interval: 5s
      timeout: 20s
      retries: 10
    ports:
    - 8978:8978
