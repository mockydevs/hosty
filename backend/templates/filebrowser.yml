x-hosty:
  name: "Filebrowser"
  version: 1
  category: "Storage"
  icon: "hard-drive"
  description: "FileBrowser is a web-based file manager and file explorer with a user-friendly interface."
  web: filebrowser

services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    environment:

    volumes:
    - type: bind
      source: ./srv
      target: /srv
      isDirectory: true
    - type: bind
      source: ./database.db
      target: /database.db
      isDirectory: false
      content: ''
    - type: bind
      source: ./filebrowser.json
      target: /.filebrowser.json
      read_only: true
      content: "{\n  \"address\": \"0.0.0.0\",\n  \"port\": 80\n}\n"
    ports:
    - 80:80
