x-hosty:
  name: "Forgejo With Postgresql"
  version: 1
  category: "Developer Tools"
  icon: "code-2"
  description: "Forgejo is a self-hosted lightweight software forge. Easy to install and low maintenance, it just does the job."
  web: forgejo
  domain_input: domain
  secrets:
    - postgresql_password
  inputs:
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"
    postgresql_user:
      type: "string"
      default: "postgresql"
      description: "Postgresql username"

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:8
    environment:

      - FORGEJO__server__ROOT_URL=${domain}
      - FORGEJO__migrations__ALLOWED_DOMAINS=${FORGEJO__migrations__ALLOWED_DOMAINS}
      - FORGEJO__migrations__ALLOW_LOCALNETWORKS=${FORGEJO__migrations__ALLOW_LOCALNETWORKS-false}
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=postgresql
      - FORGEJO__database__NAME=${POSTGRESQL_DATABASE-forgejo}
      - FORGEJO__database__USER=${postgresql_user}
      - FORGEJO__database__PASSWD=${postgresql_password}
    volumes:
      - forgejo-data:/data
      - forgejo-timezone:/etc/timezone:ro
      - forgejo-localtime:/etc/localtime:ro
    ports:
      - 22222:22
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
      interval: 2s
      timeout: 10s
      retries: 15

  postgresql:
    image: postgres:16-alpine
    volumes:
      - forgejo-postgresql-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${postgresql_user}
      - POSTGRES_PASSWORD=${postgresql_password}
      - POSTGRES_DB=${POSTGRESQL_DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 20s
      retries: 10
