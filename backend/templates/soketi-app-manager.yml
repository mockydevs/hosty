x-hosty:
  name: "Soketi App Manager"
  version: 1
  category: "Developer Tools"
  icon: "code-2"
  description: "Manage soketi websocket server and apps with ease."
  web: soketi-app-manager
  domain_input: domain
  inputs:
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"

services:
  soketi-app-manager:
    image: ghcr.io/rahulhaque/soketi-app-manager-filament-alpine:latest
    environment:

    - AUTORUN_ENABLED=true
    - AUTORUN_LARAVEL_MIGRATION=${AUTORUN_LARAVEL_MIGRATION:-true}
    - APP_DEBUG=${APP_DEBUG:-false}
    - APP_URL=${domain}
    - APP_KEY=$APP_KEY
    - DB_CONNECTION=$DB_CONNECTION
    - DB_HOST=$DB_HOST
    - DB_PORT=$DB_PORT
    - DB_DATABASE=$DB_DATABASE
    - DB_USERNAME=$DB_USERNAME
    - DB_PASSWORD=$DB_PASSWORD
    - PUSHER_HOST=$PUSHER_HOST
    - PUSHER_PORT=$PUSHER_PORT
    - PUSHER_SCHEME=$PUSHER_SCHEME
    - PUSHER_APP_CLUSTER=$PUSHER_APP_CLUSTER
    - SOKETI_DB_REDIS_USERNAME=$SOKETI_DB_REDIS_USERNAME
    - SOKETI_DB_REDIS_PASSWORD=$SOKETI_DB_REDIS_PASSWORD
    - METRICS_HOST=$METRICS_HOST
    healthcheck:
      test:
      - CMD
      - php-fpm-healthcheck
      start_period: 10s
    ports:
    - 8080:8080
