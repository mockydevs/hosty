x-hosty:
  name: "Grocy"
  version: 1
  category: "Applications"
  icon: "box"
  description: "Grocy is a web-based household management and grocery list application."

services:
  grocy:
    image: lscr.io/linuxserver/grocy:4.6.0
    environment:

      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - grocy-config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80"]
      interval: 2s
      timeout: 10s
      retries: 15
