x-hosty:
  name: "Ollama With Open Webui"
  version: 1
  category: "AI"
  icon: "brain-circuit"
  description: "Ollama with Open Web UI integrates AI model deployment with a user-friendly interface."
  web: open-webui

services:
  ollama-api:
    image: ollama/ollama:latest
    volumes:
    - ollama:/root/.ollama
    healthcheck:
      test:
      - CMD
      - ollama
      - list
      interval: 5s
      timeout: 30s
      retries: 10
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    volumes:
    - open-webui:/app/backend/data
    depends_on:
    - ollama-api
    environment:

    - OLLAMA_BASE_URL=http://ollama-api:11434
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8080
      interval: 5s
      timeout: 30s
      retries: 10
    ports:
    - 8080:8080
