x-hosty:
  name: "Prefect"
  version: 1
  category: "Automation"
  icon: "zap"
  description: "Prefect is an orchestration and observability platform that empowers developers to build and scale workflows quickly."
  web: prefect
  domain_input: domain
  secrets:
    - postgres_password
    - apikey_password
  inputs:
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"
    postgres_user:
      type: "string"
      default: "postgres"
      description: "Postgres username"

services:
  prefect:
    image: prefecthq/prefect:3-latest
    depends_on:
      postgresql:
        condition: service_healthy
    environment:

    - PREFECT_API_URL=${domain}/api
    - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://${postgres_user}:${postgres_password}@postgresql:5432/${POSTGRES_DB:-prefect}
    - PREFECT_API_KEY=${apikey_password}
    - PREFECT_EXPERIMENTAL_WARN=${PREFECT_EXPERIMENTAL_WARN:-false}
    - PREFECT_EXPERIMENTAL_ENABLE_SCHEDULE_CONCURRENCY=${PREFECT_EXPERIMENTAL_ENABLE_SCHEDULE_CONCURRENCY:-false}
    - PREFECT_RUNNER_SERVER_ENABLE=${PREFECT_RUNNER_SERVER_ENABLE:-false}
    - PREFECT_DEFAULT_WORK_POOL_NAME=${DEFAULT_POOL_NAME:-default}
    command:
    - prefect
    - server
    - start
    - --host
    - 0.0.0.0
    - --port
    - '4200'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import requests as r;r.get('http://127.0.0.1:4200/api/health').raise_for_status()
      interval: 5s
      timeout: 5s
      retries: 3
    ports:
    - 4200:4200
  postgresql:
    image: postgres:16-alpine
    volumes:
    - pg-data:/var/lib/postgresql/data
    environment:
    - POSTGRES_USER=${postgres_user}
    - POSTGRES_PASSWORD=${postgres_password}
    - POSTGRES_DB=${POSTGRES_DB:-prefect}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 3
  agent:
    image: prefecthq/prefect:3-python3.12
    depends_on:
      prefect:
        condition: service_healthy
    entrypoint:
    - /opt/prefect/entrypoint.sh
    - prefect
    - worker
    - start
    - --pool=${DEFAULT_POOL_NAME}
    - --with-healthcheck
    - --name=${DEFAULT_WORKER_NAME}
    - --limit=${DEFAULT_POOL_LIMIT}
    environment:
    - PREFECT_API_URL=http://prefect:4200/api
    - PREFECT_API_KEY=${apikey_password}
    - DEFAULT_POOL_NAME=${DEFAULT_POOL_NAME:-default}
    - DEFAULT_POOL_LIMIT=${DEFAULT_POOL_LIMIT:-1}
    - DEFAULT_WORKER_NAME=${DEFAULT_WORKER_NAME:-worker1}
    healthcheck:
      test:
      - CMD-SHELL
      - pwd
      interval: 5s
      timeout: 5s
      retries: 3
