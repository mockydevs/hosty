x-hosty:
  name: "Joomla With Mariadb"
  version: 1
  category: "CMS"
  icon: "file-text"
  description: "Joomla! is the mobile-ready and user-friendly way to build your website. Choose from thousands of features and designs. Joomla! is free and open source."
  secrets:
    - joomla_password
    - root_password
  inputs:
    joomla_user:
      type: "string"
      default: "joomla"
      description: "Joomla username"

services:
  joomla:
    image: joomla:latest
    volumes:
      - joomla_data:/var/www/html
    environment:

      - JOOMLA_DB_HOST=mariadb
      - JOOMLA_DB_USER=${joomla_user}
      - JOOMLA_DB_PASSWORD=${joomla_password}
      - JOOMLA_DB_NAME=${MYSQL_DATABASE:-joomla-db}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://127.0.0.1'
      interval: 2s
      timeout: 10s
      retries: 10

  mariadb:
    image: mariadb:11
    volumes:
      - joomla_mariadb_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${root_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-joomla-db}
      - MYSQL_USER=${joomla_user}
      - MYSQL_PASSWORD=${joomla_password}
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - '--connect'
        - '--innodb_initialized'
      interval: 5s
      timeout: 20s
      retries: 10
