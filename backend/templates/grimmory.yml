x-hosty:
  name: "Grimmory"
  version: 1
  category: "Applications"
  icon: "box"
  description: "Grimmory is a self-hosted application for managing your entire book collection in one place. Organize, read, annotate, sync across devices, and share without relying on third-party services."
  web: grimmory
  secrets:
    - mariadb_password
    - mariadbroot_password
  inputs:
    mariadb_user:
      type: "string"
      default: "mariadb"
      description: "Mariadb username"

services:
  grimmory:
    image: grimmory/grimmory:nightly-20260403-3a371f7
    environment:

    - USER_ID=${GRIMMORY_USER_ID:-0}
    - GROUP_ID=${GRIMMORY_GROUP_ID:-0}
    - TZ=${TZ:-UTC}
    - DATABASE_URL=jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE:-grimmory-db}
    - DATABASE_USERNAME=${mariadb_user}
    - DATABASE_PASSWORD=${mariadb_password}
    - BOOKLORE_PORT=80
    volumes:
    - grimmory-data:/app/data
    - grimmory-books:/books
    - grimmory-bookdrop:/bookdrop
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
    - 80:80
  mariadb:
    image: mariadb:12
    environment:
    - MARIADB_USER=${mariadb_user}
    - MARIADB_PASSWORD=${mariadb_password}
    - MARIADB_ROOT_PASSWORD=${mariadbroot_password}
    - MARIADB_DATABASE=${MARIADB_DATABASE:-grimmory-db}
    volumes:
    - mariadb-data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 10
