x-hosty:
  name: "Glpi"
  version: 1
  category: "Applications"
  icon: "box"
  description: "GLPI (Gestionnaire Libre de Parc Informatique) is a free, open-source IT Service Management (ITSM) platform used for IT asset management, helpdesk, and service desk operations."
  web: glpi
  secrets:
    - mysql_password
    - root_password
  inputs:
    mysql_user:
      type: "string"
      default: "mysql"
      description: "Mysql username"

services:
  glpi:
    image: glpi/glpi:11
    environment:

    - GLPI_DB_HOST=glpi-db
    - GLPI_DB_PORT=3306
    - GLPI_DB_NAME=${MYSQL_DATABASE:-glpi-db}
    - GLPI_DB_USER=${mysql_user}
    - GLPI_DB_PASSWORD=${mysql_password}
    volumes:
    - glpi-data:/var/glpi:rw
    depends_on:
      glpi-db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost/
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
    - 80:80
  glpi-db:
    image: mysql:8
    volumes:
    - mysql-data:/var/lib/mysql
    environment:
    - MYSQL_ROOT_PASSWORD=${root_password}
    - MYSQL_DATABASE=${MYSQL_DATABASE:-glpi-db}
    - MYSQL_USER=${mysql_user}
    - MYSQL_PASSWORD=${mysql_password}
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      interval: 5s
      timeout: 20s
      retries: 10
