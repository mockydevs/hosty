x-hosty:
  name: "Nextcloud With Postgres"
  version: 1
  category: "Storage"
  icon: "hard-drive"
  description: "NextCloud is a self-hosted, open-source platform that provides file storage, collaboration, and communication tools for seamless data management."
  web: nextcloud
  secrets:
    - postgres_password
  inputs:
    postgres_user:
      type: "string"
      default: "postgres"
      description: "Postgres username"

services:
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    environment:

    - PUID=1000
    - PGID=1000
    - TZ=${TZ:-Europe/Paris}
    - POSTGRES_DB=${POSTGRES_DB:-nextcloud}
    - POSTGRES_USER=${postgres_user}
    - POSTGRES_PASSWORD=${postgres_password}
    - POSTGRES_HOST=nextcloud-db
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    volumes:
    - nextcloud-config:/config
    - nextcloud-data:/data
    depends_on:
      nextcloud-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:80/status.php
      interval: 30s
      timeout: 10s
      retries: 15
    ports:
    - 80:80
  nextcloud-db:
    image: postgres:16-alpine
    volumes:
    - nextcloud-postgresql-data:/var/lib/postgresql/data
    environment:
    - POSTGRES_USER=${postgres_user}
    - POSTGRES_PASSWORD=${postgres_password}
    - POSTGRES_DB=${POSTGRES_DB:-nextcloud}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 20s
      retries: 10
  redis:
    image: redis:7.4-alpine
    volumes:
    - nextcloud-redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - PING
      interval: 5s
      timeout: 10s
      retries: 20
