x-hosty:
  name: "Langflow"
  version: 1
  category: "AI"
  icon: "brain-circuit"
  description: "Langflow is an open-source, Python-based, customizable framework for building AI applications."
  web: langflow
  secrets:
    - langflow_password
    - postgres_password
  inputs:
    langflow_user:
      type: "string"
      default: "langflow"
      description: "Langflow username"
    postgres_user:
      type: "string"
      default: "postgres"
      description: "Postgres username"

services:
  langflow:
    image: langflowai/langflow:1.7.2
    environment:

    - LANGFLOW_AUTO_LOGIN=${LANGFLOW_AUTO_LOGIN:-false}
    - LANGFLOW_SUPERUSER=${langflow_user}
    - LANGFLOW_SUPERUSER_PASSWORD=${langflow_password}
    - LANGFLOW_DATABASE_URL=postgresql://${postgres_user}:${postgres_password}@postgres:5432/${POSTGRES_DB:-langflow-db}
    - LANGFLOW_CONFIG_DIR=app/langflow
    - LANGFLOW_HOST=0.0.0.0
    - PORT=7860
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://127.0.0.1:7860/health
      interval: 5s
      timeout: 20s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
    - langflow-data:/app/langflow
    ports:
    - 7860:7860
  postgres:
    image: postgres:18-alpine
    environment:
    - POSTGRES_USER=${postgres_user}
    - POSTGRES_PASSWORD=${postgres_password}
    - POSTGRES_DB=${POSTGRES_DB:-langflow-db}
    volumes:
    - langflow-postgres:/var/lib/postgres/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 20s
      retries: 10
