x-hosty:
  name: "Nextcloud With Mariadb"
  version: 1
  category: "Storage"
  icon: "hard-drive"
  description: "NextCloud is a self-hosted, open-source platform that provides file storage, collaboration, and communication tools for seamless data management."
  web: nextcloud
  secrets:
    - mariadb_password
    - root_password
  inputs:
    mariadb_user:
      type: "string"
      default: "mariadb"
      description: "Mariadb username"

services:
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    environment:

    - PUID=1000
    - PGID=1000
    - TZ=${TZ:-Europe/Paris}
    - MYSQL_DATABASE=${MARIADB_DATABASE:-nextcloud}
    - MYSQL_USER=${mariadb_user}
    - MYSQL_PASSWORD=${mariadb_password}
    - MYSQL_HOST=nextcloud-db
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    volumes:
    - nextcloud-config:/config
    - nextcloud-data:/data
    depends_on:
      nextcloud-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:80/status.php
      interval: 30s
      timeout: 10s
      retries: 15
    ports:
    - 80:80
  nextcloud-db:
    image: mariadb:11
    volumes:
    - nextcloud-mariadb-data:/var/lib/mysql
    environment:
    - MYSQL_ROOT_PASSWORD=${root_password}
    - MYSQL_DATABASE=${MARIADB_DATABASE:-nextcloud}
    - MYSQL_USER=${mariadb_user}
    - MYSQL_PASSWORD=${mariadb_password}
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 5s
      timeout: 20s
      retries: 10
  redis:
    image: redis:7.4-alpine
    volumes:
    - nextcloud-redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - PING
      interval: 5s
      timeout: 10s
      retries: 20
