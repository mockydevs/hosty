x-hosty:
  name: "Orangehrm"
  version: 1
  category: "Applications"
  icon: "box"
  description: "OrangeHRM open source HR management software."
  web: orangehrm
  secrets:
    - mysql_password
    - mysqlroot_password
  inputs:
    mysql_user:
      type: "string"
      default: "mysql"
      description: "Mysql username"

services:
  orangehrm:
    image: orangehrm/orangehrm:latest
    platform: linux/amd64
    environment:

    - ORANGEHRM_DATABASE_HOST=mariadb
    - ORANGEHRM_DATABASE_USER=${mysql_user}
    - ORANGEHRM_DATABASE_PASSWORD=${mysql_password}
    - ORANGEHRM_DATABASE_NAME=${MYSQL_DATABASE:-orangehrm-db}
    volumes:
    - orangehrm-data:/orangehrm
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1
      interval: 2s
      timeout: 10s
      retries: 10
    ports:
    - 80:80
  mariadb:
    image: mariadb:11
    volumes:
    - orangehrm_mariadb_data:/var/lib/mysql
    environment:
    - MYSQL_ROOT_PASSWORD=${mysqlroot_password}
    - MYSQL_DATABASE=${MYSQL_DATABASE:-orangehrm-db}
    - MYSQL_USER=${mysql_user}
    - MYSQL_PASSWORD=${mysql_password}
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 5s
      timeout: 20s
      retries: 10
