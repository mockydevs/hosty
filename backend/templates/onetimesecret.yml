x-hosty:
  name: "Onetimesecret"
  version: 1
  category: "Security"
  icon: "shield"
  description: "Share sensitive information securely with self-destructing links that are only viewable once."
  web: onetimesecret
  secrets:
    - redis_password
    - onetimesecret_password

services:
  onetimesecret:
    image: onetimesecret/onetimesecret:latest
    environment:

    - AUTH_AUTOVERIFY=${AUTH_AUTOVERIFY:-true}
    - AUTH_SIGNUP=${AUTH_SIGNUP:-true}
    - COLONEL=${COLONEL:-admin@example.com}
    - HOST=${HOST:-localhost}
    - REDIS_URL=redis://:${redis_password}@redis:6379/0
    - SECRET=${onetimesecret_password}
    - SSL=${SSL:-false}
    - RACK_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - ruby
      - -rnet/http
      - -e
      - 'exit(Net::HTTP.get_response(URI(''http://localhost:3000'')).is_a?(Net::HTTPSuccess)
        ? 0 : 1)'
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
    - 3000:3000
  redis:
    image: redis:8-alpine
    command: redis-server --requirepass ${redis_password}
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 10s
      retries: 3
