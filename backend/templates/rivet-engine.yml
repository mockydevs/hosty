x-hosty:
  name: "Rivet Engine"
  version: 1
  category: "Developer Tools"
  icon: "code-2"
  description: "Build and scale stateful workloads with long-lived processes"
  web: rivet-engine

services:
  rivet-engine:
    image: rivetdev/engine:2.2.0
    environment:

    - RIVET__FILE_SYSTEM__PATH=/data
    - RIVET__AUTH__ADMIN_TOKEN=${SERVICE_BASE64_TOKEN}
    volumes:
    - rivet-data:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:6420/health
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 30s
    ports:
    - 6420:6420
