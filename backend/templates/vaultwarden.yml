x-hosty:
  name: "Vaultwarden"
  version: 1
  category: "Security"
  icon: "shield"
  description: "Vaultwarden is a password manager that allows you to securely store and manage your passwords."
  secrets:
    - admin_key
  inputs:
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"

services:
  vaultwarden:
    image: vaultwarden/server:latest
    environment:

      - DOMAIN=${domain}
      - DATABASE_URL=${VAULTWARDEN_DB_URL:-data/db.sqlite3}
      - SIGNUPS_ALLOWED=${SIGNUP_ALLOWED:-true}
      - ADMIN_TOKEN=${admin_key}
      - IP_HEADER=X-Forwarded-For
      - PUSH_ENABLED=${PUSH_ENABLED:-false}
      - PUSH_INSTALLATION_ID=${PUSH_SERVICE_ID}
      - PUSH_INSTALLATION_KEY=${PUSH_SERVICE_KEY}
    volumes:
      - vaultwarden-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80"]
      interval: 2s
      timeout: 10s
      retries: 15
