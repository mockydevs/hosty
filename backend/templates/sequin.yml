x-hosty:
  name: "Sequin"
  version: 1
  category: "Analytics"
  icon: "bar-chart-2"
  description: "The fastest Postgres change data capture"
  web: sequin
  domain_input: domain
  secrets:
    - postgres_password
  inputs:
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"
    postgres_user:
      type: "string"
      default: "postgres"
      description: "Postgres username"

services:
  sequin:
    image: sequin/sequin:latest
    environment:

    - SERVER_HOST=${domain}
    - PG_HOSTNAME=postgres
    - PG_DATABASE=${POSTGRES_DB:-sequin-db}
    - PG_PORT=5432
    - PG_USERNAME=${postgres_user}
    - PG_PASSWORD=${postgres_password}
    - PG_POOL_SIZE=20
    - SECRET_KEY_BASE=${SERVICE_REALBASE64_64_SECRETKEY}
    - VAULT_KEY=${SERVICE_REALBASE64_VAULTKEY}
    - REDIS_URL=redis://redis:6379
    - CONFIG_FILE_PATH=/config/playground.yml
    - FEATURE_ACCOUNT_SELF_SIGNUP=${FEATURE_ACCOUNT_SELF_SIGNUP:-false}
    - SEQUIN_TELEMETRY_DISABLED=${SEQUIN_TELEMETRY_DISABLED:-false}
    - CRASH_REPORTING_DISABLED=${CRASH_REPORTING_DISABLED:-false}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - http://localhost:7376/health
    ports:
    - 7376:7376
  postgres:
    image: postgres:16
    environment:
    - POSTGRES_DB=${POSTGRES_DB:-sequin-db}
    - POSTGRES_USER=${postgres_user}
    - POSTGRES_PASSWORD=${postgres_password}
    command:
    - postgres
    - -c
    - wal_level=logical
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${postgres_user} -d sequin
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 2s
      start_interval: 1s
    volumes:
    - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    command:
    - redis-server
    - --port
    - '6379'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 20s
      retries: 10
    volumes:
    - redis_data:/data
