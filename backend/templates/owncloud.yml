x-hosty:
  name: "Owncloud"
  version: 1
  category: "Storage"
  icon: "hard-drive"
  description: "OwnCloud with Open Web UI integrates file management with a powerful, user-friendly interface."
  web: owncloud
  domain_input: domain
  secrets:
    - mariadb_password
    - owncloud_password
    - mariadbroot_password
  inputs:
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"
    mariadb_user:
      type: "string"
      default: "mariadb"
      description: "Mariadb username"
    owncloud_user:
      type: "string"
      default: "owncloud"
      description: "Owncloud username"

services:
  owncloud:
    image: owncloud/server:latest
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:

    - OWNCLOUD_DOMAIN=${domain}
    - OWNCLOUD_TRUSTED_DOMAINS=${domain}
    - OWNCLOUD_DB_TYPE=mysql
    - OWNCLOUD_DB_HOST=mariadb
    - OWNCLOUD_DB_NAME=${DB_NAME:-owncloud}
    - OWNCLOUD_DB_USERNAME=${mariadb_user}
    - OWNCLOUD_DB_PASSWORD=${mariadb_password}
    - OWNCLOUD_ADMIN_USERNAME=${owncloud_user}
    - OWNCLOUD_ADMIN_PASSWORD=${owncloud_password}
    - OWNCLOUD_MYSQL_UTF8MB4=${MYSQL_UTF8MB4:-true}
    - OWNCLOUD_REDIS_ENABLED=${REDIS_ENABLED:-true}
    - OWNCLOUD_REDIS_HOST=redis
    healthcheck:
      test:
      - CMD
      - /usr/bin/healthcheck
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
    - owncloud-data:/mnt/data
    ports:
    - 8080:8080
  mariadb:
    image: mariadb:latest
    environment:
    - MYSQL_ROOT_PASSWORD=${mariadbroot_password}
    - MYSQL_USER=${mariadb_user}
    - MYSQL_PASSWORD=${mariadb_password}
    - MYSQL_DATABASE=${DB_NAME:-owncloud}
    - TZ=auto
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_bin
    - --max-allowed-packet=128M
    - --innodb-log-file-size=64M
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 5s
      timeout: 20s
      retries: 10
    volumes:
    - owncloud-mysql-data:/var/lib/mysql
  redis:
    image: redis:6
    command:
    - --databases
    - '1'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
