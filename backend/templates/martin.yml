x-hosty:
  name: "Martin"
  version: 1
  category: "Applications"
  icon: "box"
  description: "Martin is a tile server able to generate and serve vector tiles on the fly from large PostGIS databases, PMTiles (local or remote), and MBTiles files, allowing multiple tile sources to be dynamical..."
  web: martin
  domain_input: domain
  secrets:
    - postgres_password
  inputs:
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"
    postgres_user:
      type: "string"
      default: "postgres"
      description: "Postgres username"

services:
  martin:
    image: ghcr.io/maplibre/martin:v0.13.0
    environment:

    - HOST=${domain}
    - DATABASE_URL=postgresql://${postgres_user}:${postgres_password}@postgresql:5432/${POSTGRES_DB:-martin-db}
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:3000
      interval: 5s
      timeout: 20s
      retries: 10
    ports:
    - 3000:3000
  postgresql:
    image: postgis/postgis:16-3.4-alpine
    platform: linux/amd64
    volumes:
    - martin-postgresql-data:/var/lib/postgresql/data
    environment:
    - POSTGRES_USER=${postgres_user}
    - POSTGRES_PASSWORD=${postgres_password}
    - POSTGRES_DB=${POSTGRES_DB:-martin-db}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 20s
      retries: 10
