x-hosty:
  name: "Gitea With Postgresql"
  version: 1
  category: "Developer Tools"
  icon: "code-2"
  description: "Gitea is a self-hosted, lightweight Git service, offering version control, collaboration, and code hosting."
  web: gitea
  secrets:
    - postgresql_password
  inputs:
    postgresql_user:
      type: "string"
      default: "postgresql"
      description: "Postgresql username"

services:
  gitea:
    image: gitea/gitea:latest
    environment:

      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgresql
      - GITEA__database__NAME=${POSTGRESQL_DATABASE-gitea}
      - GITEA__database__USER=${postgresql_user}
      - GITEA__database__PASSWD=${postgresql_password}
    volumes:
      - gitea-data:/data
      - gitea-timezone:/etc/timezone:ro
      - gitea-localtime:/etc/localtime:ro
    ports:
      - 22222:22
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
      interval: 2s
      timeout: 10s
      retries: 15

  postgresql:
    image: postgres:16-alpine
    volumes:
      - gitea-postgresql-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${postgresql_user}
      - POSTGRES_PASSWORD=${postgresql_password}
      - POSTGRES_DB=${POSTGRESQL_DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 20s
      retries: 10
