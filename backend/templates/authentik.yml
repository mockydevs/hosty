x-hosty:
  name: "Authentik"
  version: 1
  category: "Security"
  icon: "shield"
  description: "An open-source Identity Provider, focused on flexibility and versatility."
  web: authentik-server
  secrets:
    - postgresql_password
    - authentikserver_key
  inputs:
    postgresql_user:
      type: "string"
      default: "postgresql"
      description: "Postgresql username"

services:
  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2025.10.3}
    restart: unless-stopped
    command: server
    environment:

    - AUTHENTIK_POSTGRESQL__HOST=${POSTGRES_HOST:-postgresql}
    - AUTHENTIK_POSTGRESQL__USER=${postgresql_user}
    - AUTHENTIK_POSTGRESQL__NAME=${POSTGRES_DB:-authentik}
    - AUTHENTIK_POSTGRESQL__PASSWORD=${postgresql_password}
    - AUTHENTIK_SECRET_KEY=${authentikserver_key}
    - AUTHENTIK_ERROR_REPORTING__ENABLED=${AUTHENTIK_ERROR_REPORTING__ENABLED:-true}
    - AUTHENTIK_EMAIL__HOST=${AUTHENTIK_EMAIL__HOST}
    - AUTHENTIK_EMAIL__PORT=${AUTHENTIK_EMAIL__PORT}
    - AUTHENTIK_EMAIL__USERNAME=${AUTHENTIK_EMAIL__USERNAME}
    - AUTHENTIK_EMAIL__PASSWORD=${AUTHENTIK_EMAIL__PASSWORD}
    - AUTHENTIK_EMAIL__USE_TLS=${AUTHENTIK_EMAIL__USE_TLS}
    - AUTHENTIK_EMAIL__USE_SSL=${AUTHENTIK_EMAIL__USE_SSL}
    - AUTHENTIK_EMAIL__TIMEOUT=${AUTHENTIK_EMAIL__TIMEOUT}
    - AUTHENTIK_EMAIL__FROM=${AUTHENTIK_EMAIL__FROM}
    volumes:
    - ./media:/media
    - ./custom-templates:/templates
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
    - 9000:9000
  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2025.10.3}
    restart: unless-stopped
    command: worker
    environment:
    - AUTHENTIK_POSTGRESQL__HOST=${POSTGRES_HOST:-postgresql}
    - AUTHENTIK_POSTGRESQL__USER=${postgresql_user}
    - AUTHENTIK_POSTGRESQL__NAME=${POSTGRES_DB:-authentik}
    - AUTHENTIK_POSTGRESQL__PASSWORD=${postgresql_password}
    - AUTHENTIK_SECRET_KEY=${authentikserver_key}
    - AUTHENTIK_ERROR_REPORTING__ENABLED=${AUTHENTIK_ERROR_REPORTING__ENABLED}
    - AUTHENTIK_EMAIL__HOST=${AUTHENTIK_EMAIL__HOST}
    - AUTHENTIK_EMAIL__PORT=${AUTHENTIK_EMAIL__PORT}
    - AUTHENTIK_EMAIL__USERNAME=${AUTHENTIK_EMAIL__USERNAME}
    - AUTHENTIK_EMAIL__PASSWORD=${AUTHENTIK_EMAIL__PASSWORD}
    - AUTHENTIK_EMAIL__USE_TLS=${AUTHENTIK_EMAIL__USE_TLS}
    - AUTHENTIK_EMAIL__USE_SSL=${AUTHENTIK_EMAIL__USE_SSL}
    - AUTHENTIK_EMAIL__TIMEOUT=${AUTHENTIK_EMAIL__TIMEOUT}
    - AUTHENTIK_EMAIL__FROM=${AUTHENTIK_EMAIL__FROM}
    user: root
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./media:/media
    - ./certs:/certs
    - ./custom-templates:/templates
    depends_on:
      postgresql:
        condition: service_healthy
  postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 2s
      timeout: 10s
      retries: 15
    volumes:
    - authentik-db:/var/lib/postgresql/data
    environment:
    - POSTGRES_PASSWORD=${postgresql_password}
    - POSTGRES_USER=${postgresql_user}
    - POSTGRES_DB=authentik
