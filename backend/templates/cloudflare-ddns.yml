x-hosty:
  name: "Cloudflare Ddns"
  version: 1
  category: "Automation"
  icon: "zap"
  description: "A small, feature-rich, and robust Cloudflare DDNS updater."

services:
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:1.16.2
    network_mode: host
    user: "1000:1000"
    read_only: true
    cap_drop: [all]
    security_opt: [no-new-privileges:true]
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:?}
      - DOMAINS=${DOMAINS:?}
      - PROXIED=${PROXIED:-false}
      - IP6_PROVIDER=${IP6_PROVIDER:-none}
