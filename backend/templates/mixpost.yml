x-hosty:
  name: "Mixpost"
  version: 1
  category: "Analytics"
  icon: "bar-chart-2"
  description: "Mixpost is a robust and versatile social media management software, designed to streamline social media operations and enhance content marketing strategies."
  secrets:
    - mysql_password
    - mysqlroot_password
  inputs:
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"
    mysql_user:
      type: "string"
      default: "mysql"
      description: "Mysql username"

services:
  mixpost:
    image: 'inovector/mixpost:latest'
    environment:

      - APP_NAME=Mixpost
      - APP_KEY=${SERVICE_BASE64_MIXPOST}
      - APP_DEBUG=false
      - APP_DOMAIN=${domain}
      - APP_URL=${domain}
      - DB_DATABASE=${MYSQL_DATABASE:-mixpost_db}
      - DB_USERNAME=${mysql_user}
      - DB_PASSWORD=${mysql_password}
      - SSL_EMAIL=${SSL_EMAIL:-user@example.com}
    volumes:
      - mixpost-storage:/var/www/html/storage/app
      - mixpost-logs:/var/www/html/storage/logs
    depends_on:
      - mysql
      - redis
  mysql:
    image: 'mysql/mysql-server:8.0'
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-mixpost_db}
      - MYSQL_USER=${mysql_user}
      - MYSQL_PASSWORD=${mysql_password}
      - MYSQL_ROOT_PASSWORD=${mysqlroot_password}
    volumes:
      - mixpost-mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - '-h'
        - 127.0.0.1
        - '-uroot'
        - '-p${mysqlroot_password}'
      interval: 5s
      timeout: 20s
      retries: 10
  redis:
    image: 'redis:alpine'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - '--raw'
        - incr
        - ping
