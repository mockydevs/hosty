x-hosty:
  name: "It Tools"
  version: 1
  category: "Developer Tools"
  icon: "code-2"
  description: "IT Tools is a self-hosted solution for managing various IT tasks."
  web: it-tools

services:
  it-tools:
    image: corentinth/it-tools:latest
    environment:

    volumes:
    - it-tools-data:/app/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:80
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
    - 80:80
