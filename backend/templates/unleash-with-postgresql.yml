x-hosty:
  name: "Unleash With Postgresql"
  version: 1
  category: "Developer Tools"
  icon: "code-2"
  description: "Open source feature flag management for enterprises."
  web: unleash
  domain_input: domain
  secrets:
    - unleash_password
    - postgres_password
  inputs:
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"
    postgres_user:
      type: "string"
      default: "postgres"
      description: "Postgres username"

services:
  unleash:
    image: unleashorg/unleash-server:latest
    environment:

    - UNLEASH_URL=${domain}
    - UNLEASH_DEFAULT_ADMIN_PASSWORD=${unleash_password}
    - DATABASE_URL=postgres://${postgres_user}:${postgres_password}@postgres/db
    - DATABASE_SSL=false
    - LOG_LEVEL=warn
    - INIT_FRONTEND_API_TOKENS=default:default:development.unleash-insecure-frontend-api-token
    - INIT_CLIENT_API_TOKENS=default:development.unleash-insecure-api-token
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:4242/health || exit
        1
      interval: 1s
      timeout: 1m
      retries: 5
      start_period: 15s
    ports:
    - 4242:4242
  postgres:
    image: postgres:15
    volumes:
    - postgresql-data:/var/lib/postgresql/data
    environment:
    - POSTGRES_USER=${postgres_user}
    - POSTGRES_PASSWORD=${postgres_password}
    - POSTGRES_DB=db
    healthcheck:
      test:
      - CMD
      - pg_isready
      - --username=${postgres_user}
      - --host=127.0.0.1
      - --port=5432
      - --dbname=db
      interval: 2s
      timeout: 1m
      retries: 5
      start_period: 10s
