x-hosty:
  name: "Yamtrack"
  version: 1
  category: "Applications"
  icon: "box"
  description: "Yamtrack is a self hosted media tracker for movies, tv shows, anime, manga, video games and books."
  web: yamtrack
  domain_input: domain
  secrets:
    - secret_password
  inputs:
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"

services:
  yamtrack:
    image: ghcr.io/fuzzygrim/yamtrack
    environment:

    - URLS=${domain}
    - TZ=${TZ:-Europe/Berlin}
    - SECRET=${secret_password}
    - REGISTRATION=${REGISTRATION_ENABLED:-true}
    - REDIS_URL=redis://redis:6379
    volumes:
    - yamtrack_data:/yamtrack/db
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget --quiet --tries=1 --spider http://127.0.0.1:8000/health/ || exit 1
      interval: 5s
      timeout: 20s
      retries: 10
    ports:
    - 8000:8000
  redis:
    image: redis:7-alpine
    volumes:
    - yamtrack_redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 20s
      retries: 10
