x-hosty:
  name: "Gitea Runner"
  version: 1
  category: "Developer Tools"
  icon: "code-2"
  description: "Gitea Actions runner for docker"

services:
  runner:
    image: 'docker.io/gitea/runner:1.0.7'
    environment:
      - 'GITEA_INSTANCE_URL=${GITEA_INSTANCE_URL}'
      - 'GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_REGISTRATION_TOKEN}'
      - 'GITEA_RUNNER_NAME=${GITEA_RUNNER_NAME:-gitea-runner}'
      - 'GITEA_RUNNER_LABELS=${GITEA_RUNNER_LABELS:-ubuntu-latest:docker://node:22}'
      - 'GITEA_TOKEN=${GITEA_TOKEN}'
    working_dir: /data
    volumes:
      - 'runner-data:/data'
      - '/var/run/docker.sock:/var/run/docker.sock'
    healthcheck:
      test:
        - CMD-SHELL
        - "ps aux | grep '[R]unner' > /dev/null || exit 1"
      interval: 5s
      timeout: 10s
      retries: 15
