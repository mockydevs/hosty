x-hosty:
  name: "Infisical"
  version: 1
  category: "Security"
  icon: "shield"
  description: "Infisical is the open source secret management platform that developers use to centralize their application configuration and secrets like API keys and database credentials."
  web: backend
  domain_input: domain
  secrets:
    - encryptionkey_password
    - postgres_password
  inputs:
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"
    postgres_user:
      type: "string"
      default: "postgres"
      description: "Postgres username"

services:
  backend:
    image: infisical/infisical:v0.154.6
    environment:

    - SITE_URL=${domain}_8080}
    - NODE_ENV=${NODE_ENV:-production}
    - ENCRYPTION_KEY=${encryptionkey_password}
    - AUTH_SECRET=${SERVICE_REALBASE64_64_AUTHSECRET}
    - SMTP_HOST=${SMTP_HOST}
    - SMTP_USERNAME=${SMTP_USERNAME}
    - SMTP_PASSWORD=${SMTP_PASSWORD}
    - SMTP_PORT=${SMTP_PORT}
    - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS}
    - SMTP_FROM_NAME=${SMTP_FROM_NAME}
    - INF_APP_CONNECTION_GITHUB_APP_CLIENT_ID=${INF_APP_CONNECTION_GITHUB_APP_CLIENT_ID}
    - INF_APP_CONNECTION_GITHUB_APP_CLIENT_SECRET=${INF_APP_CONNECTION_GITHUB_APP_CLIENT_SECRET}
    - INF_APP_CONNECTION_GITHUB_APP_SLUG=${INF_APP_CONNECTION_GITHUB_APP_SLUG}
    - INF_APP_CONNECTION_GITHUB_APP_ID=${INF_APP_CONNECTION_GITHUB_APP_ID}
    - INF_APP_CONNECTION_GITHUB_APP_PRIVATE_KEY=${INF_APP_CONNECTION_GITHUB_APP_PRIVATE_KEY}
    - DB_CONNECTION_URI=postgres://${postgres_user}:${postgres_password}@db:5432/${POSTGRES_DB}
    - REDIS_URL=redis://redis:6379
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/status || exit
        1
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    ports:
    - 8080:8080
  redis:
    image: redis:7
    volumes:
    - redis-data:/data
    environment:
    - ALLOW_EMPTY_PASSWORD=${ALLOW_EMPTY_PASSWORD:-yes}
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -h localhost -p 6379 ping
      interval: 5s
      timeout: 5s
      retries: 3
  db:
    image: postgres:14-alpine
    volumes:
    - pg_data:/var/lib/postgresql/data
    environment:
    - POSTGRES_USER=${postgres_user}
    - POSTGRES_PASSWORD=${postgres_password}
    - POSTGRES_DB=${POSTGRES_DB:-infisical}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 10s
      retries: 10
