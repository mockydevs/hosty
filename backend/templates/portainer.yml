x-hosty:
  name: "Portainer"
  version: 1
  category: "Developer Tools"
  icon: "code-2"
  description: "Portainer is a lightweight management UI for Docker"
  web: portainer

services:
  portainer:
    image: portainer/portainer-ce:alpine
    environment:

    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - portainer_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:9000/
      interval: 20s
      timeout: 20s
      retries: 10
    ports:
    - 9000:9000
