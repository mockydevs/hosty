x-hosty:
  name: "Castopod"
  version: 1
  category: "Media"
  icon: "film"
  description: "Castopod is a free & open-source hosting platform made for podcasters who want engage and interact with their audience."
  web: castopod
  domain_input: domain
  secrets:
    - mysql_password
    - redis_password
  inputs:
    mysql_user:
      type: "string"
      default: "mysql"
      description: "Mysql username"
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"

services:
  castopod:
    image: castopod/castopod:1.15.4
    volumes:
    - castopod-media:/var/www/castopod/public/media
    environment:

    - MYSQL_DATABASE=castopod
    - MYSQL_USER=${mysql_user}
    - MYSQL_PASSWORD=${mysql_password}
    - CP_DISABLE_HTTPS=${CP_DISABLE_HTTPS:-1}
    - CP_BASEURL=${domain}
    - CP_ANALYTICS_SALT=$SERVICE_REALBASE64_64_SALT
    - CP_CACHE_HANDLER=redis
    - CP_REDIS_HOST=redis
    - CP_REDIS_PASSWORD=${redis_password}
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 5s
      timeout: 20s
      retries: 10
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
    - 8080:8080
  mariadb:
    image: mariadb:11.2
    volumes:
    - castopod-db:/var/lib/mysql
    environment:
    - MYSQL_ROOT_PASSWORD=${mysql_password}
    - MYSQL_DATABASE=castopod
    - MYSQL_USER=${mysql_user}
    - MYSQL_PASSWORD=${mysql_password}
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 5s
      timeout: 20s
      retries: 10
  redis:
    image: redis:7.2-alpine
    command: --requirepass ${redis_password}
    volumes:
    - castopod-cache:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a ${redis_password} ping | grep PONG
      interval: 5s
      timeout: 20s
      retries: 10
