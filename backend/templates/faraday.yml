x-hosty:
  name: "Faraday"
  version: 1
  category: "Security"
  icon: "shield"
  description: "Faraday is a powerful, open-source, web-based vulnerability management tool."
  web: faraday
  secrets:
    - postgresql_password
  inputs:
    postgresql_user:
      type: "string"
      default: "postgresql"
      description: "Postgresql username"

services:
  postgresql:
    image: postgres:latest
    volumes:
    - faraday-db:/var/lib/postgresql/data
    environment:
    - POSTGRES_PASSWORD=${postgresql_password}
    - POSTGRES_USER=${postgresql_user}
    - POSTGRES_DB=${POSTGRES_DB:-faraday}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 15s
      timeout: 10s
      retries: 15
  redis:
    image: redis:alpine
    command: --save 60 1 --loglevel warning
    volumes:
    - redis:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping | grep PONG
      interval: 15s
      timeout: 10s
      retries: 15
  faraday:
    image: faradaysec/faraday:latest
    entrypoint: /entrypoint.sh
    environment:

    - AUTHENTIK_POSTGRESQL__PASSWORD=${postgresql_password}
    - PGSQL_USER=${postgresql_user}
    - PGSQL_PASSWD=${postgresql_password}
    - PGSQL_DBNAME=${POSTGRES_DB}
    - PGSQL_HOST=postgresql
    - REDIS_SERVER=redis
    volumes:
    - faraday:/home/faraday/.faraday:rw
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '5985'
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
    - 5985:5985
