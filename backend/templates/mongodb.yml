x-hosty:
  name: "MongoDB"
  version: 1
  category: "Databases"
  icon: "mongodb"
  description: "MongoDB is a source-available cross-platform document-oriented database program."
  ports:
    - db
  secrets:
    - root_password
  inputs:
    username:
      type: "string"
      default: "root"
      description: "Root username"

services:
  db:
    image: docker.io/library/mongo:7.0@sha256:8ecb514b00bdcc0bde67ef4e6c330385377a9dc68e24ee94e28c07c891647348
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${username}
      MONGO_INITDB_ROOT_PASSWORD: ${root_password}
    volumes:
      - db-data:/data/db
