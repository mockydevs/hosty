x-hosty:
  name: "Odoo"
  version: 1
  category: "Applications"
  icon: "box"
  description: "Odoo is a suite of open-source business apps that cover all your company needs."
  web: odoo
  secrets:
    - postgres_password
  inputs:
    postgres_user:
      type: "string"
      default: "postgres"
      description: "Postgres username"

services:
  odoo:
    image: odoo:18
    environment:

    - HOST=postgresql
    - USER=${postgres_user}
    - PASSWORD=${postgres_password}
    volumes:
    - odoo-web-data:/var/lib/odoo
    - odoo-extra-addons:/mnt/extra-addons
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8069
      interval: 2s
      timeout: 10s
      retries: 30
    ports:
    - 8069:8069
  postgresql:
    image: postgres:16-alpine
    volumes:
    - postgresql-data:/var/lib/postgresql/data
    environment:
    - POSTGRES_USER=${postgres_user}
    - POSTGRES_PASSWORD=${postgres_password}
    - POSTGRES_DB=postgres
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d postgres
      interval: 5s
      timeout: 20s
      retries: 10
