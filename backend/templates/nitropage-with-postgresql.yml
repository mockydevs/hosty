x-hosty:
  name: "Nitropage With Postgresql"
  version: 1
  category: "CMS"
  icon: "file-text"
  description: "Nitropage is an extensible, visual website builder, offering a growing library of versatile building blocks, focal-point image cropping and sovereign font management."
  web: nitropage
  secrets:
    - session_key
    - postgresql_password
  inputs:
    postgresql_user:
      type: "string"
      default: "postgresql"
      description: "Postgresql username"

services:
  nitropage:
    image: nitropage/nitropage
    environment:

    - NP_AUTH_SALT=${SERVICE_BASE64_SALT}
    - NP_AUTH_PASSWORD=${session_key}
    - DATABASE_URL=postgresql://${postgresql_user}:${postgresql_password}@postgresql:5432/${POSTGRESQL_DATABASE:-nitropage}
    volumes:
    - nitropage-data:/app/.data
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:3000/admin
      interval: 2s
      timeout: 10s
      retries: 15
    ports:
    - 3000:3000
  postgresql:
    image: postgres:16-alpine
    volumes:
    - nitropage-postgresql-data:/var/lib/postgresql/data
    environment:
    - POSTGRES_USER=${postgresql_user}
    - POSTGRES_PASSWORD=${postgresql_password}
    - POSTGRES_DB=${POSTGRESQL_DATABASE:-nitropage}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 20s
      retries: 10
