x-hosty:
  name: "Glitchtip"
  version: 1
  category: "Monitoring"
  icon: "activity"
  description: "GlitchTip is a error tracking system."
  web: web
  domain_input: domain
  secrets:
    - postgresql_password
  inputs:
    postgresql_user:
      type: "string"
      default: "postgresql"
      description: "Postgresql username"
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"

services:
  postgres:
    image: postgres:16-alpine
    environment:
    - POSTGRES_USER=${postgresql_user}
    - POSTGRES_PASSWORD=${postgresql_password}
    - POSTGRES_DB=${POSTGRESQL_DATABASE:-glitchtip}
    volumes:
    - glitchtip-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 20s
      retries: 10
  redis:
    image: redis
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 20s
      retries: 10
  web:
    image: glitchtip/glitchtip:6.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:

    - DATABASE_URL=postgres://${postgresql_user}:${postgresql_password}@postgres:5432/${POSTGRESQL_DATABASE:-glitchtip}
    - SECRET_KEY=$SERVICE_BASE64_64_ENCRYPTION
    - EMAIL_URL=${EMAIL_URL:-consolemail://}
    - GLITCHTIP_DOMAIN=${domain}
    - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-test@example.com}
    - CELERY_WORKER_AUTOSCALE=${CELERY_WORKER_AUTOSCALE:-1,3}
    - CELERY_WORKER_MAX_TASKS_PER_CHILD=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10000}
    volumes:
    - uploads:/code/uploads
    healthcheck:
      test:
      - CMD
      - echo
      - ok
      interval: 5s
      timeout: 20s
      retries: 10
    ports:
    - 8000:8000
  worker:
    image: glitchtip/glitchtip:6.0
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - DATABASE_URL=postgres://${postgresql_user}:${postgresql_password}@postgres:5432/${POSTGRESQL_DATABASE:-glitchtip}
    - SECRET_KEY=$SERVICE_BASE64_64_ENCRYPTION
    - EMAIL_URL=${EMAIL_URL:-consolemail://}
    - GLITCHTIP_DOMAIN=${domain}
    - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-test@example.com}
    - CELERY_WORKER_AUTOSCALE=${CELERY_WORKER_AUTOSCALE:-1,3}
    - CELERY_WORKER_MAX_TASKS_PER_CHILD=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10000}
    volumes:
    - uploads:/code/uploads
    healthcheck:
      test:
      - CMD
      - echo
      - ok
      interval: 5s
      timeout: 20s
      retries: 10
  migrate:
    image: glitchtip/glitchtip:6.0
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ./manage.py migrate
    environment:
    - DATABASE_URL=postgres://${postgresql_user}:${postgresql_password}@postgres:5432/${POSTGRESQL_DATABASE:-glitchtip}
    - SECRET_KEY=$SERVICE_BASE64_64_ENCRYPTION
    - EMAIL_URL=${EMAIL_URL:-consolemail://}
    - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-test@example.com}
    - CELERY_WORKER_AUTOSCALE=${CELERY_WORKER_AUTOSCALE:-1,3}
    - CELERY_WORKER_MAX_TASKS_PER_CHILD=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10000}
