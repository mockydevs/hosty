x-hosty:
  name: "WordPress"
  version: 1
  category: "Applications"
  icon: "wordpress"
  description: "Deploy a fully containerized WordPress instance with MariaDB."
  ports:
    - web
  secrets:
    - db_password
    - wp_admin_password
  inputs:
    domain:
      type: "string"
      description: "Public domain (HTTPS via Caddy)"
    title:
      type: "string"
      description: "Site title"
    admin_user:
      type: "string"
      default: "admin"
      description: "Admin username"
    admin_email:
      type: "string"
      description: "Admin email address"

services:
  db:
    image: docker.io/library/mariadb:10.11@sha256:5a5c675881ef3fd1c1da9b0a3bfd6ee82edbe39cd9e32e06be18034c37235e0e
    environment:
      MARIADB_ROOT_PASSWORD: ${db_password}
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${db_password}
    volumes:
      - db-data:/var/lib/mysql

  web:
    image: docker.io/library/wordpress:latest@sha256:0d8895d6940b5f05ff68342a8feeb6aa31e2ae8f5c6cbe7851e36d57aff8af4b
    ports:
      - 80:80
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${db_password}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp-data:/var/www/html
