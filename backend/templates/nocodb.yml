x-hosty:
  name: "Nocodb"
  version: 1
  category: "Applications"
  icon: "box"
  description: "NocoDB is an open source Airtable alternative. Turns any MySQL, PostgreSQL, SQL Server, SQLite & MariaDB into a smart-spreadsheet."
  web: nocodb

services:
  nocodb:
    image: nocodb/nocodb
    environment:

    volumes:
    - nocodb-data:/usr/app/data/
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:8080/api/v1/health
      interval: 5s
      timeout: 20s
      retries: 10
    ports:
    - 8080:8080
