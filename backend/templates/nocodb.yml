x-hosty:
  name: "NocoDB"
  version: 1
  category: "Databases"
  icon: "database"
  description: "NocoDB is an open source #NoCode platform that turns any database into a smart spreadsheet."
  ports:
    - web
  secrets:
    - db_password
    - jwt_secret
  inputs:
    version:
      type: "string"
      default: "latest"
      description: "NocoDB version"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: ${db_password}
    volumes:
      - db-data:/var/lib/postgresql/data

  web:
    image: nocodb/nocodb:${version}
    ports:
      - 8080:8080
    environment:
      NC_DB: "pg://db:5432?u=nocodb&p=${db_password}&d=nocodb"
      NC_AUTH_JWT_SECRET: ${jwt_secret}
    volumes:
      - nc-data:/usr/app/data/
