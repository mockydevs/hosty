x-hosty:
  name: "Cap"
  version: 1
  category: "Media"
  icon: "film"
  description: "Cap is the open source alternative to Loom. Lightweight, powerful, and cross-platform. Record and share in seconds."
  web: cap-web
  domain_input: domain
  secrets:
    - mysql_password
    - databaseencryptionkey_key
    - nextauthsecret_key
    - mysqlroot_password
  inputs:
    mysql_user:
      type: "string"
      default: "mysql"
      description: "Mysql username"
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"

services:
  cap-web:
    image: ghcr.io/capsoftware/cap-web:latest
    environment:

    - DATABASE_URL=mysql://${mysql_user}:${mysql_password}@cap-db:3306/${MYSQL_DATABASE:-planetscale}
    - WEB_URL=${domain}
    - NEXTAUTH_URL=${domain}
    - DATABASE_ENCRYPTION_KEY=${databaseencryptionkey_key}
    - NEXTAUTH_SECRET=${nextauthsecret_key}
    - CAP_AWS_ACCESS_KEY=${CAP_AWS_ACCESS_KEY:?}
    - CAP_AWS_SECRET_KEY=${CAP_AWS_SECRET_KEY:?}
    - CAP_AWS_BUCKET=${CAP_AWS_BUCKET:?}
    - CAP_AWS_REGION=${CAP_AWS_REGION:?}
    - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:?}
    - S3_INTERNAL_ENDPOINT=${S3_INTERNAL_ENDPOINT:?}
    - NEXT_RUNTIME=nodejs
    - S3_PATH_STYLE=${S3_PATH_STYLE:-true}
    - CAP_AWS_ENDPOINT=${CAP_AWS_ENDPOINT:?}
    depends_on:
      cap-db:
        condition: service_healthy
    ports:
    - 3000:3000
  cap-db:
    image: mysql:8.0
    environment:
    - MYSQL_USER=${mysql_user}
    - MYSQL_PASSWORD=${mysql_password}
    - MYSQL_DATABASE=${MYSQL_DATABASE:-planetscale}
    - MYSQL_ROOT_PASSWORD=${mysqlroot_password}
    - MYSQL_ALLOW_EMPTY_PASSWORD=${MYSQL_ALLOW_EMPTY_PASSWORD:-yes}
    command:
    - --max_connections=1000
    - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
    - cap_db:/var/lib/mysql
