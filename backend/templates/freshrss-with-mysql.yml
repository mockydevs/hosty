x-hosty:
  name: "Freshrss With Mysql"
  version: 1
  category: "Applications"
  icon: "box"
  description: "A free, self-hostable feed aggregator."
  web: freshrss
  secrets:
    - mysql_password
    - root_password
  inputs:
    mysql_user:
      type: "string"
      default: "mysql"
      description: "Mysql username"

services:
  freshrss:
    image: freshrss/freshrss:latest
    environment:

    - CRON_MIN=${CRON_MIN:-1,31}
    - MYSQL_DB=${MYSQL_DATABASE:-freshrss}
    - MYSQL_USER=${mysql_user}
    - MYSQL_PASSWORD=${mysql_password}
    volumes:
    - freshrss-data:/var/www/FreshRSS/data
    - freshrss-extensions:/var/www/FreshRSS/extensions
    depends_on:
      freshrss-db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1
      interval: 5s
      timeout: 20s
      retries: 3
    ports:
    - 80:80
  freshrss-db:
    image: mysql:8
    volumes:
    - mysql-data:/var/lib/mysql
    environment:
    - MYSQL_ROOT_PASSWORD=${root_password}
    - MYSQL_DATABASE=${MYSQL_DATABASE:-freshrss}
    - MYSQL_USER=${mysql_user}
    - MYSQL_PASSWORD=${mysql_password}
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      interval: 5s
      timeout: 20s
      retries: 10
