x-hosty:
  name: "Docuseal With Postgres"
  version: 1
  category: "Applications"
  icon: "box"
  description: "Document Signing for Everyone free forever for individuals, extensible for businesses and developers. Open Source Alternative to DocuSign, PandaDoc and more."
  web: docuseal
  domain_input: domain
  secrets:
    - postgres_password
  inputs:
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"
    postgres_user:
      type: "string"
      default: "postgres"
      description: "Postgres username"

services:
  docuseal:
    image: docuseal/docuseal:latest
    environment:

    - HOST=${domain}
    - DATABASE_URL=postgresql://${postgres_user}:${postgres_password}@postgresql:5432/${POSTGRES_DB}
    volumes:
    - docuseal-data:/data
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:3000
      interval: 5s
      timeout: 20s
      retries: 10
    ports:
    - 3000:3000
  postgresql:
    image: postgres:16-alpine
    volumes:
    - postgresql-data:/var/lib/postgresql/data
    environment:
    - POSTGRES_USER=${postgres_user}
    - POSTGRES_PASSWORD=${postgres_password}
    - POSTGRES_DB=${POSTGRES_DB:-docuseal}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 20s
      retries: 10
