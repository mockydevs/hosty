x-hosty:
  name: "Stirling Pdf"
  version: 1
  category: "Applications"
  icon: "box"
  description: "Stirling is a powerful web based PDF manipulation tool"
  web: stirling-pdf

services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    volumes:
    - stirling-training-data:/usr/share/tesseract-ocr/5/tessdata
    - stirling-configs:/configs
    - stirling-custom-files:/customFiles/
    - stirling-logs:/logs/
    environment:

    - DOCKER_ENABLE_SECURITY=false
    healthcheck:
      test: curl --fail --silent http://127.0.0.1:8080/api/v1/info/status | grep -q
        "UP" || exit 1
      interval: 5s
      timeout: 20s
      retries: 10
    ports:
    - 8080:8080
