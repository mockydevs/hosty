x-hosty:
  name: "Nextcloud With Mysql"
  version: 1
  category: "Storage"
  icon: "hard-drive"
  description: "NextCloud is a self-hosted, open-source platform that provides file storage, collaboration, and communication tools for seamless data management."
  web: nextcloud
  secrets:
    - mysql_password
    - root_password
  inputs:
    mysql_user:
      type: "string"
      default: "mysql"
      description: "Mysql username"

services:
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    environment:

    - PUID=1000
    - PGID=1000
    - TZ=${TZ:-Europe/Paris}
    - MYSQL_DATABASE=${MYSQL_DATABASE:-nextcloud}
    - MYSQL_USER=${mysql_user}
    - MYSQL_PASSWORD=${mysql_password}
    - MYSQL_HOST=nextcloud-db
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    volumes:
    - nextcloud-config:/config
    - nextcloud-data:/data
    depends_on:
      nextcloud-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:80/status.php
      interval: 30s
      timeout: 10s
      retries: 15
    ports:
    - 80:80
  nextcloud-db:
    image: mysql:8.4.2
    volumes:
    - nextcloud-mysql-data:/var/lib/mysql
    environment:
    - MYSQL_ROOT_PASSWORD=${root_password}
    - MYSQL_DATABASE=${MYSQL_DATABASE:-nextcloud}
    - MYSQL_USER=${mysql_user}
    - MYSQL_PASSWORD=${mysql_password}
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      interval: 5s
      timeout: 20s
      retries: 10
  redis:
    image: redis:7.4-alpine
    volumes:
    - nextcloud-redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - PING
      interval: 5s
      timeout: 10s
      retries: 20
