x-hosty:
  name: "Vikunja"
  version: 1
  category: "Applications"
  icon: "box"
  description: "The open-source, self-hostable to-do app. Organize everything, on all platforms."
  secrets:
    - jwtsecret_password
  inputs:
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"

services:
  vikunja:
    image: vikunja/vikunja
    environment:

      - VIKUNJA_SERVICE_PUBLICURL=${domain}
      - VIKUNJA_SERVICE_JWTSECRET=${jwtsecret_password}
      - VIKUNJA_SERVICE_ENABLEREGISTRATION=true
      - VIKUNJA_DATABASE_PATH=/db/vikunja.db
      - VIKUNJA_DATABASE_TYPE=sqlite
    volumes:
      - vikunja-data:/app/vikunja/
      - vikunja-sqlite-data:/db
    depends_on:
      - init
  init:
    image: busybox
    restart: no
    volumes:
      - vikunja-sqlite-data:/db
    command: ["sh", "-c", "touch /db/vikunja.db && chown -R 1000 /db"]
