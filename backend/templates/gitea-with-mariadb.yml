x-hosty:
  name: "Gitea With Mariadb"
  version: 1
  category: "Developer Tools"
  icon: "code-2"
  description: "Gitea is a self-hosted, lightweight Git service, offering version control, collaboration, and code hosting."
  web: gitea
  secrets:
    - mysql_password
    - mysqlroot_password
  inputs:
    mysql_user:
      type: "string"
      default: "mysql"
      description: "Mysql username"

services:
  gitea:
    image: gitea/gitea:latest
    environment:

      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=mysql
      - GITEA__database__HOST=mariadb
      - GITEA__database__NAME=${MYSQL_DATABASE-gitea}
      - GITEA__database__USER=${mysql_user}
      - GITEA__database__PASSWD=${mysql_password}
    volumes:
      - gitea-data:/data
      - gitea-timezone:/etc/timezone:ro
      - gitea-localtime:/etc/localtime:ro
    ports:
      - 22222:22
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
      interval: 2s
      timeout: 10s
      retries: 15

  mariadb:
    image: mariadb:11
    volumes:
      - gitea-mariadb-data:/var/lib/mysql
    environment:
      - MYSQL_USER=${mysql_user}
      - MYSQL_PASSWORD=${mysql_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_PASSWORD=${mysqlroot_password}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10
