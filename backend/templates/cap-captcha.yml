x-hosty:
  name: "Cap Captcha"
  version: 1
  category: "Security"
  icon: "shield"
  description: "The self-hosted CAPTCHA for the modern web."
  web: cap
  secrets:
    - admin_password

services:
  cap:
    image: tiago2/cap:3.0.4
    environment:

    - ADMIN_KEY=${admin_password}
    - REDIS_URL=redis://valkey:6379
    healthcheck:
      test:
      - CMD
      - bun
      - -e
      - fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(()
        => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      valkey:
        condition: service_healthy
    ports:
    - 3000:3000
  valkey:
    image: valkey/valkey:9-alpine
    volumes:
    - valkey-data:/data
    command: valkey-server --save 60 1 --loglevel warning --maxmemory-policy noeviction
    healthcheck:
      test:
      - CMD
      - valkey-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 5
