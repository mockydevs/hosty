x-hosty:
  name: "Classicpress With Mysql"
  version: 1
  category: "CMS"
  icon: "file-text"
  description: "A lightweight, stable, instantly familiar free open-source content management system, based on WordPress without the block editor (Gutenberg)."
  secrets:
    - classicpress_password
    - root_password
  inputs:
    classicpress_user:
      type: "string"
      default: "classicpress"
      description: "Classicpress username"

services:
  classicpress:
    image: classicpress/classicpress:latest
    volumes:
      - classicpress-files:/var/www/html
    environment:

      - CLASSICPRESS_DB_HOST=mysql
      - CLASSICPRESS_DB_USER=${classicpress_user}
      - CLASSICPRESS_DB_PASSWORD=${classicpress_password}
      - CLASSICPRESS_DB_NAME=classicpress
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1"]
      interval: 2s
      timeout: 10s
      retries: 10
  mysql:
    image: mysql:8
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${root_password}
      - MYSQL_DATABASE=classicpress
      - MYSQL_USER=${classicpress_user}
      - MYSQL_PASSWORD=${classicpress_password}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 20s
      retries: 10
