x-hosty:
  name: "Nocobase"
  version: 1
  category: "Developer Tools"
  icon: "code-2"
  description: "NocoBase is the most extensible AI-powered no-code/low-code platform."
  web: nocobase
  secrets:
    - postgres_password
  inputs:
    postgres_user:
      type: "string"
      default: "postgres"
      description: "Postgres username"

services:
  nocobase:
    image: nocobase/nocobase:1.9.33
    environment:

    - APP_KEY=${SERVICE_BASE64_64_APPKEY}
    - DB_DIALECT=postgres
    - DB_HOST=postgres
    - DB_PORT=5432
    - DB_DATABASE=${POSTGRES_DB:-nocobase-db}
    - DB_USER=${postgres_user}
    - DB_PASSWORD=${postgres_password}
    volumes:
    - nocobase-storage:/app/nocobase/storage
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    - 13000:13000
  postgres:
    image: postgres:17-alpine
    environment:
    - POSTGRES_USER=${postgres_user}
    - POSTGRES_PASSWORD=${postgres_password}
    - POSTGRES_DB=${POSTGRES_DB:-nocobase-db}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 20s
      retries: 10
