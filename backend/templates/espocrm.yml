x-hosty:
  name: "Espocrm"
  version: 1
  category: "Applications"
  icon: "box"
  description: "EspoCRM is a free and open-source CRM platform."
  secrets:
    - admin_password
    - mariadb_password
    - root_password
  inputs:
    mariadb_user:
      type: "string"
      default: "mariadb"
      description: "Mariadb username"
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"

services:
  espocrm:
    image: espocrm/espocrm:9
    environment:

      - ESPOCRM_ADMIN_USERNAME=${ESPOCRM_ADMIN_USERNAME:-admin}
      - ESPOCRM_ADMIN_PASSWORD=${admin_password}
      - ESPOCRM_DATABASE_PLATFORM=Mysql
      - ESPOCRM_DATABASE_HOST=espocrm-db
      - ESPOCRM_DATABASE_NAME=${MARIADB_DATABASE:-espocrm}
      - ESPOCRM_DATABASE_USER=${mariadb_user}
      - ESPOCRM_DATABASE_PASSWORD=${mariadb_password}
      - ESPOCRM_SITE_URL=${domain}
    volumes:
      - espocrm:/var/www/html
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80"]
      interval: 2s
      start_period: 60s
      timeout: 10s
      retries: 15
    depends_on:
      espocrm-db:
        condition: service_healthy

  espocrm-daemon:
    image: espocrm/espocrm:9
    container_name: espocrm-daemon
    volumes:
      - espocrm:/var/www/html
    restart: always
    entrypoint: docker-daemon.sh
    depends_on:
      espocrm:
        condition: service_healthy

  espocrm-websocket:
    image: espocrm/espocrm:9
    container_name: espocrm-websocket
    environment:

      - ESPOCRM_CONFIG_USE_WEB_SOCKET=true
      - ESPOCRM_CONFIG_WEB_SOCKET_URL=${domain}_WEBSOCKET
      - ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBSCRIBER_DSN=tcp://*:7777
      - ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBMISSION_DSN=tcp://espocrm-websocket:7777
    volumes:
      - espocrm:/var/www/html
    restart: always
    entrypoint: docker-websocket.sh
    depends_on:
      espocrm:
        condition: service_healthy

  espocrm-db:
    image: mariadb:11.8
    environment:
      - MARIADB_DATABASE=${MARIADB_DATABASE:-espocrm}
      - MARIADB_USER=${mariadb_user}
      - MARIADB_PASSWORD=${mariadb_password}
      - MARIADB_ROOT_PASSWORD=${root_password}
    volumes:
      - espocrm-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      start_period: 10s
      timeout: 10s
      retries: 3
