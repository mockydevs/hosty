x-hosty:
  name: "Passbolt"
  version: 1
  category: "Security"
  icon: "shield"
  description: "Passbolt Community Edition (CE) API. The JSON API for the open source password manager for teams!"
  secrets:
    - passbolt_password
    - rootmariadb_password
  inputs:
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"
    passbolt_user:
      type: "string"
      default: "passbolt"
      description: "Passbolt username"

services:
  passbolt:
    image: passbolt/passbolt:latest-ce
    environment:

      - APP_FULL_BASE_URL=${domain}
      - DATASOURCES_DEFAULT_HOST=mariadb
      - DATASOURCES_DEFAULT_USERNAME=${passbolt_user}
      - DATASOURCES_DEFAULT_PASSWORD=${passbolt_password}
      - DATASOURCES_DEFAULT_DATABASE=${MYSQL_DB:-passbolt-db}
    volumes:
      - "gpg_volume:/etc/passbolt/gpg"
      - "jwt_volume:/etc/passbolt/jwt"
    command:
      - /usr/bin/wait-for.sh
      - "-t"
      - "0"
      - "mariadb:3306"
      - "--"
      - /docker-entrypoint.sh
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80"]
      interval: 5s
      timeout: 20s
      retries: 10

  mariadb:
    image: mariadb:11
    environment:
      - MARIADB_ROOT_PASSWORD=${rootmariadb_password}
      - MARIADB_DATABASE=${MYSQL_DB:-passbolt-db}
      - MARIADB_USER=${passbolt_user}
      - MARIADB_PASSWORD=${passbolt_password}
    volumes:
      - "passbolt_mariadb_data:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10
