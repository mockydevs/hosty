x-hosty:
  name: "Ghost"
  version: 1
  category: "CMS"
  icon: "file-text"
  description: "Ghost is a content management system (CMS) and blogging platform."
  web: ghost
  domain_input: domain
  secrets:
    - mysql_password
    - mysqlroot_password
  inputs:
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"
    mysql_user:
      type: "string"
      default: "mysql"
      description: "Mysql username"

services:
  ghost:
    image: ghost:5
    volumes:
    - ghost-content-data:/var/lib/ghost/content
    environment:

    - url=${domain}
    - database__client=mysql
    - database__connection__host=mysql
    - database__connection__user=${mysql_user}
    - database__connection__password=${mysql_password}
    - database__connection__database=${MYSQL_DATABASE-ghost}
    - mail__transport=SMTP
    - mail__options__auth__pass=${MAIL_OPTIONS_AUTH_PASS}
    - mail__options__auth__user=${MAIL_OPTIONS_AUTH_USER}
    - mail__options__secure=${MAIL_OPTIONS_SECURE:-true}
    - mail__options__port=${MAIL_OPTIONS_PORT:-465}
    - mail__options__service=${MAIL_OPTIONS_SERVICE:-Mailgun}
    - mail__options__host=${MAIL_OPTIONS_HOST}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - echo
      - ok
      interval: 5s
      timeout: 20s
      retries: 10
    ports:
    - 2368:2368
  mysql:
    image: mysql:8.0
    volumes:
    - ghost-mysql-data:/var/lib/mysql
    environment:
    - MYSQL_USER=${mysql_user}
    - MYSQL_PASSWORD=${mysql_password}
    - MYSQL_DATABASE=${MYSQL_DATABASE}
    - MYSQL_ROOT_PASSWORD=${mysqlroot_password}
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      interval: 5s
      timeout: 20s
      retries: 10
