x-hosty:
  name: "Observium"
  version: 1
  category: "Monitoring"
  icon: "activity"
  description: "Observium is a comprehensive network monitoring platform designed to deliver powerful monitoring capabilities, combined with an elegant and intuitive user interface."
  secrets:
    - observiumadmin_password
    - mariadb_password
    - mariadbroot_password
  inputs:
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"
    observiumadmin_user:
      type: "string"
      default: "observiumadmin"
      description: "Observiumadmin username"
    mariadb_user:
      type: "string"
      default: "mariadb"
      description: "Mariadb username"

services:
  observium:
    image: mbixtech/observium:latest
    platform: linux/amd64
    volumes:
      - observium_logs:/opt/observium/logs
      - observium_rrd:/opt/observium/rrd
    environment:
      - SERVICE_URL_OBSERVIUM=${domain}
      - OBSERVIUM_ADMIN_PASS=${observiumadmin_password}
      - OBSERVIUM_ADMIN_USER=${observiumadmin_user}
      - OBSERVIUM_DB_HOST=mariadb
      - OBSERVIUM_DB_NAME=${OBSERVIUM_DB_NAME:-observium-db}
      - OBSERVIUM_DB_PASS=${mariadb_password}
      - OBSERVIUM_DB_USER=${mariadb_user}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://localhost/"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  mariadb:
    image: mariadb:lts
    volumes:
      - observium_mariadb_data:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=${mariadbroot_password}
      - MARIADB_USER=${mariadb_user}
      - MARIADB_PASSWORD=${mariadb_password}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-observium-db}
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - "--connect"
        - "--innodb_initialized"
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
