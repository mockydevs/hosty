x-hosty:
  name: "Duplicati"
  version: 1
  category: "Storage"
  icon: "hard-drive"
  description: "Duplicati is a backup solution, allowing you to make scheduled backups with encryption."
  web: duplicati
  secrets:
    - encrypt_password
    - web_password

services:
  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    environment:

    - PUID=1000
    - PGID=1000
    - TZ=${TZ:-Europe/London}
    - SETTINGS_ENCRYPTION_KEY=${encrypt_password}
    - DUPLICATI__WEBSERVICE_PASSWORD=${web_password}
    volumes:
    - duplicati-config:/config
    - duplicati-backups:/backups
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8200
      interval: 2s
      timeout: 10s
      retries: 15
    ports:
    - 8200:8200
