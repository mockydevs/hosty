x-hosty:
  name: "Beszel"
  version: 1
  category: "Monitoring"
  icon: "activity"
  description: "A lightweight server resource monitoring hub with historical data, docker stats, and alerts."
  web: beszel
  domain_input: domain
  inputs:
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"

services:
  beszel:
    image: henrygd/beszel:0.18.7
    environment:

    - CONTAINER_DETAILS=${CONTAINER_DETAILS:-true}
    - SHARE_ALL_SYSTEMS=${SHARE_ALL_SYSTEMS:-false}
    volumes:
    - beszel_data:/beszel_data
    - beszel_socket:/beszel_socket
    healthcheck:
      test:
      - CMD
      - /beszel
      - health
      - --url
      - http://localhost:8090
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 5s
    ports:
    - 8090:8090
  beszel-agent:
    image: henrygd/beszel-agent:0.18.7
    network_mode: host
    environment:
    - LISTEN=/beszel_socket/beszel.sock
    - HUB_URL=${domain}
    - TOKEN=${TOKEN}
    - KEY=${KEY}
    - DISABLE_SSH=${DISABLE_SSH:-false}
    - LOG_LEVEL=${LOG_LEVEL:-warn}
    - SKIP_GPU=${SKIP_GPU:-false}
    - SYSTEM_NAME=${SYSTEM_NAME}
    volumes:
    - beszel_agent_data:/var/lib/beszel-agent
    - beszel_socket:/beszel_socket
    - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test:
      - CMD
      - /agent
      - health
      interval: 60s
      timeout: 20s
      retries: 10
      start_period: 5s
