x-hosty:
  name: "Meilisearch"
  version: 1
  category: "Search"
  icon: "search"
  description: "Deploy Meilisearch for fast application search."
  web: web
  ports:
    - web
  secrets:
    - master_key

services:
  web:
    image: docker.io/getmeili/meilisearch:v1.12
    ports:
      - 7700:7700
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${master_key}
    volumes:
      - meili-data:/meili_data
