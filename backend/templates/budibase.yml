x-hosty:
  name: "Budibase"
  version: 1
  category: "Automation"
  icon: "zap"
  description: "Low code platform for building business apps and workflows in minutes. Supports PostgreSQL, MySQL, MSSQL, MongoDB, Rest API, Docker, K8s, and more."
  web: proxy-service
  secrets:
    - couchdb_password
    - minio_password
    - redis_password
    - watchtower_password
  inputs:
    couchdb_user:
      type: "string"
      default: "couchdb"
      description: "Couchdb username"
    minio_user:
      type: "string"
      default: "minio"
      description: "Minio username"

services:
  app-service:
    image: budibase.docker.scarf.sh/budibase/apps
    environment:
    - SELF_HOSTED=1
    - COUCH_DB_URL=http://${couchdb_user}:${couchdb_password}@couchdb-service:5984
    - WORKER_URL=http://worker-service:4003
    - MINIO_URL=http://minio-service:9000
    - MINIO_ACCESS_KEY=${minio_user}
    - MINIO_SECRET_KEY=${minio_password}
    - INTERNAL_API_KEY=$SERVICE_BASE64_128_BUDIBASE
    - BUDIBASE_ENVIRONMENT=${BUDIBASE_ENVIRONMENT:-PRODUCTION}
    - PORT=4002
    - API_ENCRYPTION_KEY=$SERVICE_BASE64_64_BUDIBASEAPI
    - ENCRYPTION_KEY=$SERVICE_BASE64_64_BUDIBASE
    - JWT_SECRET=$SERVICE_BASE64_64_BUDIBASEJWT
    - LOG_LEVEL=info
    - ENABLE_ANALYTICS=${ENABLE_ANALYTICS:-true}
    - REDIS_URL=redis-service:6379
    - REDIS_PASSWORD=${redis_password}
    - BB_ADMIN_USER_EMAIL=
    - BB_ADMIN_USER_PASSWORD=
    depends_on:
    - worker-service
    - redis-service
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -qO-
      - http://localhost:4002/health
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
  worker-service:
    image: budibase.docker.scarf.sh/budibase/worker
    environment:
    - SELF_HOSTED=1
    - PORT=4003
    - CLUSTER_PORT=10000
    - API_ENCRYPTION_KEY=$SERVICE_BASE64_64_BUDIBASEAPI
    - JWT_SECRET=$SERVICE_BASE64_64_BUDIBASEJWT
    - MINIO_ACCESS_KEY=${minio_user}
    - MINIO_SECRET_KEY=${minio_password}
    - MINIO_URL=http://minio-service:9000
    - APPS_URL=http://app-service:4002
    - COUCH_DB_USERNAME=${couchdb_user}
    - COUCH_DB_PASSWORD=${couchdb_password}
    - COUCH_DB_URL=http://${couchdb_user}:${couchdb_password}@couchdb-service:5984
    - INTERNAL_API_KEY=$SERVICE_BASE64_128_BUDIBASE
    - REDIS_URL=redis-service:6379
    - REDIS_PASSWORD=${redis_password}
    depends_on:
    - redis-service
    - minio-service
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -qO-
      - http://localhost:4003/health
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
  minio-service:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    volumes:
    - minio_data:/data
    environment:
    - MINIO_ROOT_USER=${minio_user}
    - MINIO_ROOT_PASSWORD=${minio_password}
    - MINIO_BROWSER=off
    command: server /data --console-address ":9001"
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 5s
      timeout: 20s
      retries: 10
  proxy-service:
    image: budibase/proxy
    environment:

    - PROXY_RATE_LIMIT_WEBHOOKS_PER_SECOND=10
    - PROXY_RATE_LIMIT_API_PER_SECOND=20
    - APPS_UPSTREAM_URL=http://app-service:4002
    - WORKER_UPSTREAM_URL=http://worker-service:4003
    - MINIO_UPSTREAM_URL=http://minio-service:9000
    - COUCHDB_UPSTREAM_URL=http://couchdb-service:5984
    - WATCHTOWER_UPSTREAM_URL=http://watchtower-service:8080
    - RESOLVER=127.0.0.11
    depends_on:
    - minio-service
    - worker-service
    - app-service
    - couchdb-service
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:10000/
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
    ports:
    - 10000:10000
  couchdb-service:
    image: budibase/couchdb
    environment:
    - COUCHDB_PASSWORD=${couchdb_password}
    - COUCHDB_USER=${couchdb_user}
    - TARGETBUILD=docker-compose
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5984/
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
    volumes:
    - couchdb3_data:/opt/couchdb/data
  redis-service:
    image: redis
    command: redis-server --requirepass "${redis_password}"
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${redis_password}
      - ping
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
  watchtower-service:
    restart: always
    image: containrrr/watchtower
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    command: --debug --http-api-update bbapps bbworker bbproxy
    environment:
    - WATCHTOWER_HTTP_API=true
    - WATCHTOWER_HTTP_API_TOKEN=${watchtower_password}
    - WATCHTOWER_CLEANUP=true
    labels:
    - com.centurylinklabs.watchtower.enable=false
    exclude_from_hc: true
