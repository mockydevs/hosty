x-hosty:
  name: "Libretranslate"
  version: 1
  category: "AI"
  icon: "brain-circuit"
  description: "Free and open-source machine translation API, entirely self-hosted."
  web: libretranslate

services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    environment:

    - LT_SSL=${LT_SSL:-true}
    - LT_UPDATE_MODELS=${LT_UPDATE_MODELS:-true}
    - LT_LOAD_ONLY=${LT_LOAD_ONLY:-en,es,fr,de,ja}
    volumes:
    - libretranslate-api-keys:/app/db
    - libretranslate-models:/home/libretranslate/.local
    healthcheck:
      test:
      - CMD-SHELL
      - ./venv/bin/python scripts/healthcheck.py
    ports:
    - 5000:5000
