x-hosty:
  name: "Netdata"
  version: 1
  category: "Monitoring"
  icon: "activity"
  description: "Netdata provides real-time performance and health monitoring for servers, containers, and applications."
  ports:
    - web
  web: web

services:
  web:
    image: docker.io/netdata/netdata:v2
    ports:
      - 19999:19999
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata-config:/etc/netdata
      - netdata-lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
