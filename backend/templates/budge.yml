x-hosty:
  name: "Budge"
  version: 1
  category: "Applications"
  icon: "box"
  description: "A budgeting personal finance app."

services:
  budge:
    image: lscr.io/linuxserver/budge:latest
    environment:

      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - budge-config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80"]
      interval: 2s
      timeout: 10s
      retries: 15
