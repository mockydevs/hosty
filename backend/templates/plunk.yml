x-hosty:
  name: "Plunk"
  version: 1
  category: "Applications"
  icon: "box"
  description: "Plunk, The Open-Source Email Platform for AWS"
  web: plunk
  domain_input: domain
  secrets:
    - postgres_password
    - jwtsecret_password
  inputs:
    postgres_user:
      type: "string"
      default: "postgres"
      description: "Postgres username"
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"

services:
  plunk:
    image: driaug/plunk:latest
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:

    - REDIS_URL=redis://redis:6379
    - DATABASE_URL=postgresql://${postgres_user}:${postgres_password}@postgresql/plunk-db?schema=public
    - JWT_SECRET=${jwtsecret_password}
    - AWS_REGION=${AWS_REGION:?}
    - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?}
    - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?}
    - AWS_SES_CONFIGURATION_SET=${AWS_SES_CONFIGURATION_SET:?}
    - NEXT_PUBLIC_API_URI=${domain}/api
    - APP_URI=${domain}
    - API_URI=${domain}/api
    - DISABLE_SIGNUPS=${DISABLE_SIGNUPS:-False}
    - NODE_OPTIONS=--no-network-family-autoselection
    entrypoint:
    - /app/entry.sh
    healthcheck:
      test:
      - CMD-SHELL
      - (wget -S --spider http://127.0.0.1:3000/api/health 2>&1 | grep -q "HTTP/1.1
        [1-3]")
      interval: 2s
      timeout: 10s
      retries: 15
    ports:
    - 3000:3000
  postgresql:
    image: postgres:16-alpine
    environment:
    - POSTGRES_USER=${postgres_user}
    - POSTGRES_PASSWORD=${postgres_password}
    - POSTGRES_DB=${POSTGRES_DB:-plunk-db}
    volumes:
    - plunk-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 20s
      retries: 10
  redis:
    image: redis:7.4-alpine
    volumes:
    - plunk-redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - PING
      interval: 5s
      timeout: 10s
      retries: 20
