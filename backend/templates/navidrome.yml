x-hosty:
  name: "Navidrome"
  version: 1
  category: "Media"
  icon: "film"
  description: "Standalone server, that allows you to browse and listen to your music collection using a web browser or any Subsonic-compatible client."
  web: navidrome
  domain_input: domain
  inputs:
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"

services:
  navidrome:
    image: deluan/navidrome:latest
    restart: unless-stopped
    environment:

    - ND_BASEURL=${domain}
    - ND_SCANSCHEDULE=${ND_SCANSCHEDULE:-1h}
    - ND_LOGLEVEL=${ND_LOGLEVEL:-info}
    - ND_SESSIONTIMEOUT=${ND_SESSIONTIMEOUT:-24h}
    - ND_ENABLEINSIGHTSCOLLECTOR=${ND_ENABLEINSIGHTSCOLLECTOR:-false}
    volumes:
    - ./data:/data
    - ./music:/music:ro
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - --quiet
      - http://127.0.0.1:4533/ping
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
    - 4533:4533
