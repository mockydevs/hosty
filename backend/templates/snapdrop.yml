x-hosty:
  name: "Snapdrop"
  version: 1
  category: "Applications"
  icon: "box"
  description: "A self-hosted file-sharing service for secure and convenient file transfers, whether on a local network or the internet."

services:
  snapdrop:
    image: 'linuxserver/snapdrop:version-b8b78cc2'
    environment:

      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - snapdrop-config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80"]
      interval: 2s
      timeout: 10s
      retries: 15
