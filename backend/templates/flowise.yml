x-hosty:
  name: "Flowise"
  version: 1
  category: "AI"
  icon: "brain-circuit"
  description: "Flowise is an open source low-code tool for developers to build customized LLM orchestration flows & AI agents."
  web: flowise
  secrets:
    - flowise_password
  inputs:
    flowise_user:
      type: "string"
      default: "flowise"
      description: "Flowise username"

services:
  flowise:
    image: flowiseai/flowise:latest
    environment:

    - DEBUG=${DEBUG:-false}
    - DISABLE_FLOWISE_TELEMETRY=${DISABLE_FLOWISE_TELEMETRY:-true}
    - PORT=${PORT:-3001}
    - DATABASE_PATH=/root/.flowise
    - APIKEY_PATH=/root/.flowise
    - SECRETKEY_PATH=/root/.flowise
    - LOG_PATH=/root/.flowise/logs
    - BLOB_STORAGE_PATH=/root/.flowise/storage
    - FLOWISE_USERNAME=${flowise_user}
    - FLOWISE_PASSWORD=${flowise_password}
    volumes:
    - flowise-data:/root/.flowise
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:3001 || exit 1
      interval: 5s
      timeout: 5s
      retries: 3
    ports:
    - 3001:3001
