x-hosty:
  name: "Rallly"
  version: 1
  category: "Applications"
  icon: "box"
  description: "Rallly is an open-source scheduling and collaboration tool designed to make organizing events and meetings easier."
  web: rallly
  domain_input: domain
  secrets:
    - postgres_password
    - rallly_key
  inputs:
    postgres_user:
      type: "string"
      default: "postgres"
      description: "Postgres username"
    domain:
      type: "string"
      description: "Public domain (e.g. https://app.example.com)"

services:
  rallly_db:
    image: postgres:14.2
    volumes:
    - rallly_db_data:/var/lib/postgresql/data
    environment:
    - POSTGRES_PASSWORD=${postgres_password}
    - POSTGRES_USER=${postgres_user}
    - POSTGRES_DB=${POSTGRES_DB:-rallly}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 2s
      timeout: 10s
      retries: 15
  rallly:
    image: lukevella/rallly:latest
    platform: linux/amd64
    depends_on:
      rallly_db:
        condition: service_healthy
    environment:

    - DATABASE_URL=postgres://${postgres_user}:${postgres_password}@rallly_db:5432/${POSTGRES_DB:-rallly}
    - SECRET_PASSWORD=${rallly_key}
    - NEXT_PUBLIC_BASE_URL=${domain}
    - ALLOWED_EMAILS=${ALLOWED_EMAILS}
    - SUPPORT_EMAIL=${SUPPORT_EMAIL:-support@example.com}
    - SMTP_HOST=${SMTP_HOST}
    - SMTP_PORT=${SMTP_PORT}
    - SMTP_SECURE=${SMTP_SECURE:-false}
    - SMTP_USER=${SMTP_USER}
    - SMTP_PWD=${SMTP_PWD}
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c ':> /dev/tcp/127.0.0.1/3000' || exit 1
      interval: 5s
      timeout: 20s
      retries: 10
    ports:
    - 3000:3000
